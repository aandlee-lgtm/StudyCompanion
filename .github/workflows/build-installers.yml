name: Build Mac app

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  macos:
    needs: test
    runs-on: macos-14   # Apple silicon (M1 or newer)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build app and DMG (includes the bundled self-test)
        run: ./packaging/build_macos.sh
      - name: Launch the packaged app and check it serves pages
        run: ./packaging/smoke_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HSC-Companion-macOS
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Mac (Apple silicon, M1 or newer):** download the .dmg, open it and drag HSC Companion to Applications.
            First launch: right-click the app → Open (it is not notarised by Apple).
            Your study data is kept in ~/Library/Application Support/HSC Companion and survives updates.
