name: Build installers

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  macos:
    needs: test
    runs-on: macos-14   # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: ./packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HSC-Companion-macOS
          path: dist/*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: .\packaging\build_windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: HSC-Companion-Windows
          path: dist/*Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            Download the file for your computer:
            - **Mac (Apple silicon)**: the .dmg — open it and drag HSC Companion to Applications. First launch: right-click → Open.
            - **Windows**: the Setup.exe — run it (no administrator rights needed). If SmartScreen warns, click "More info" → "Run anyway".
            Your study data is kept separately and survives updates.
